name: iOS build (IPA sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PlixiOS/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PlixiOS
    steps:
      - uses: actions/checkout@v4

      - name: Elegir Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Secretos de compilación
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Falta el secret TMDB_API_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf 'TMDB_API_KEY = %s\n' "$TMDB_API_KEY" > Config/Secrets.xcconfig
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > Config/GoogleService-Info.plist
            plutil -lint Config/GoogleService-Info.plist
          else
            echo "::warning::Sin GOOGLE_SERVICE_INFO_PLIST_BASE64: la app se compila sin cuenta, amigos ni Cine Virtual."
          fi

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (Release, sin firma)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project PlixiOS.xcodeproj \
            -scheme PlixiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log

      - name: Empaquetar IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PLIX-unsigned.ipa Payload
          ls -lh PLIX-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PLIX-unsigned-ipa
          path: PlixiOS/PLIX-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: PlixiOS/build/xcodebuild.log
