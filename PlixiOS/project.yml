name: PlixiOS
options:
  bundleIdPrefix: com.lzrdgz01
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: es

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  PlixiOS:
    type: application
    platform: iOS
    sources:
      - path: PlixiOS
        excludes:
          - "Resources/**"
      - path: PlixiOS/Resources
        buildPhase: resources
        excludes:
          - "**/.gitkeep"
      # GoogleService-Info.plist: colocar en PlixiOS/Resources/ (está en .gitignore).
      # Sin ese archivo la app compila en modo local; con él se activa Firebase.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_NAME: PLIX
        PRODUCT_BUNDLE_IDENTIFIER: com.lzrdgz01.plix
        INFOPLIST_FILE: Config/Info.plist
        MARKETING_VERSION: "22"
        CURRENT_PROJECT_VERSION: "22"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
